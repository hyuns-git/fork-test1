<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>테트리스 - 바이브 코딩 실습</title>
  <style>
    /* ===== 기본 레이아웃 ===== */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111827;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Consolas', monospace;
      color: #e2e8f0;
    }

    .game-container {
      display: flex;
      gap: 24px;
      align-items: flex-start;
    }

    /* ===== 게임 캔버스 ===== */
    #gameCanvas {
      border: 2px solid #334155;
      background: #0f172a;
      display: block;
    }

    /* ===== 사이드 패널 ===== */
    .side-panel {
      width: 160px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .panel-box {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px;
    }

    .panel-box h3 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #64748b;
      margin-bottom: 6px;
    }

    .panel-box .value {
      font-size: 24px;
      font-weight: bold;
      color: #e2e8f0;
    }

    .preview-canvas {
      background: #0f172a;
      border: 1px solid #334155;
      display: block;
      margin-top: 4px;
    }

    /* 게임 오버 오버레이 */
    .canvas-wrapper {
      position: relative;
    }

    #overlay {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.75);
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 16px;
      font-size: 24px;
      color: #f1f5f9;
    }

    #overlay.show { display: flex; }

    #restartBtn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 10px 28px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'Consolas', monospace;
    }
    #restartBtn:hover { background: #2563eb; }

    /* 조작 안내 */
    .controls {
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.6;
    }
  </style>
</head>
<body>

<div class="game-container">

  <div class="canvas-wrapper">
    <canvas id="gameCanvas" width="300" height="600"></canvas>
    <div id="overlay">
      <div>GAME OVER</div>
      <button id="restartBtn">다시 시작</button>
    </div>
  </div>

  <div class="side-panel">
    <div class="panel-box">
      <h3>최고 점수</h3>
      <div class="value" id="highScoreDisplay">0</div>
    </div>
    <div class="panel-box">
      <h3>점수</h3>
      <div class="value" id="scoreDisplay">0</div>
    </div>
    <div class="panel-box">
      <h3>레벨</h3>
      <div class="value" id="levelDisplay">1</div>
    </div>
    <div class="panel-box">
      <h3>라인</h3>
      <div class="value" id="linesDisplay">0</div>
    </div>
    <div class="panel-box">
      <h3>다음 블록</h3>
      <canvas id="nextCanvas" width="90" height="90" class="preview-canvas"></canvas>
    </div>
    <div class="panel-box">
      <h3>홀드 (Shift)</h3>
      <canvas id="holdCanvas" width="90" height="90" class="preview-canvas"></canvas>
    </div>
    <div class="panel-box controls">
      <h3>조작법</h3>
      ← → : 이동<br>
      ↑ : 회전<br>
      ↓ : 소프트 드롭<br>
      Space : 하드 드롭<br>
      Shift : 홀드
    </div>
  </div>

</div>

<script>
// ============================================================
//  ■ 상수 정의 (Constants)
// ============================================================
const COLS        = 10;
const ROWS        = 20;
const BLOCK_SIZE  = 30;

const SHAPES = {
  I: [[1, 1, 1, 1]],
  O: [[1, 1],
      [1, 1]],
  T: [[0, 1, 0],
      [1, 1, 1]],
  S: [[0, 1, 1],
      [1, 1, 0]],
  Z: [[1, 1, 0],
      [0, 1, 1]],
  L: [[1, 0],
      [1, 0],
      [1, 1]],
  J: [[0, 1],
      [0, 1],
      [1, 1]],
};

const COLORS = {
  I: '#00f0f0',
  O: '#f0f000',
  T: '#a000f0',
  S: '#00f000',
  Z: '#f00000',
  L: '#f0a000',
  J: '#0000f0',
};

const PIECE_TYPES = Object.keys(SHAPES);

// ============================================================
//  ■ 캔버스 초기화
// ============================================================
const canvas = document.getElementById('gameCanvas');
const ctx    = canvas.getContext('2d');

const nextCanvas = document.getElementById('nextCanvas');
const nextCtx    = nextCanvas.getContext('2d');

const holdCanvas = document.getElementById('holdCanvas');
const holdCtx    = holdCanvas.getContext('2d');

// ============================================================
//  ■ 게임 상태 변수
// ============================================================
let board        = [];
let currentPiece = null;
let score        = 0;
let level        = 1;
let linesCleared = 0;
let gameOver     = false;
let lastTime     = 0;
let dropInterval = 1000;

// Phase 3 추가 상태 변수
let nextPiece    = null;
let holdPiece    = null;
let canHold      = true;
let highScore    = localStorage.getItem('tetris_high_score') || 0;

// ============================================================
//  ■ 단일 블록 그리기 헬퍼
// ============================================================
function drawBlock(x, y, color) {
  ctx.fillStyle = color;
  ctx.fillRect(
    x * BLOCK_SIZE,
    y * BLOCK_SIZE,
    BLOCK_SIZE - 1,
    BLOCK_SIZE - 1
  );
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  ctx.fillRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE - 1, 4);
}

// ============================================================
//  TODO 1: initBoard()
// ============================================================
function initBoard() {
  board = [];
  for (let r = 0; r < ROWS; r++) {
    board.push(new Array(COLS).fill(null));
  }
}

// ============================================================
//  TODO 2: createPiece() + Phase 3 Next 시스템 연동
// ============================================================
function generateRandomPiece() {
  const type = PIECE_TYPES[Math.floor(Math.random() * PIECE_TYPES.length)];
  const shape = SHAPES[type];
  return {
    type: type,
    shape: shape,
    color: COLORS[type],
    x: Math.floor((COLS - shape[0].length) / 2),
    y: 0
  };
}

function createPiece() {
  if (!nextPiece) {
    nextPiece = generateRandomPiece();
  }
  currentPiece = nextPiece;
  nextPiece = generateRandomPiece();
  canHold = true;

  // 새 블록 생성 직후 충돌 검사하여 게임 오버 판단
  if (isCollision(currentPiece, 0, 0)) {
    gameOver = true;
    handleHighScore();
    showGameOver();
  }

  drawPreview(nextCtx, nextPiece);
}

// ============================================================
//  TODO 3: isCollision(piece, dx, dy)
// ============================================================
function isCollision(piece, dx, dy) {
  for (let r = 0; r < piece.shape.length; r++) {
    for (let c = 0; c < piece.shape[r].length; c++) {
      if (piece.shape[r][c] !== 0) {
        const nextX = piece.x + c + dx;
        const nextY = piece.y + r + dy;

        if (nextX < 0 || nextX >= COLS || nextY >= ROWS) {
          return true;
        }
        if (nextY >= 0 && board[nextY][nextX] !== null) {
          return true;
        }
      }
    }
  }
  return false;
}

// ============================================================
//  TODO 4: rotate(shape)
// ============================================================
function rotate(shape) {
  const rows = shape.length;
  const cols = shape[0].length;
  const rotated = Array.from({ length: cols }, () => new Array(rows).fill(0));

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      rotated[c][rows - 1 - r] = shape[r][c];
    }
  }
  return rotated;
}

// ============================================================
//  TODO 5: placePiece()
// ============================================================
function placePiece() {
  for (let r = 0; r < currentPiece.shape.length; r++) {
    for (let c = 0; c < currentPiece.shape[r].length; c++) {
      if (currentPiece.shape[r][c] === 1) {
        const targetY = currentPiece.y + r;
        const targetX = currentPiece.x + c;
        if (targetY >= 0) {
          board[targetY][targetX] = currentPiece.color;
        }
      }
    }
  }
}

// ============================================================
//  TODO 6: clearLines()
// ============================================================
function clearLines() {
  let clearedCount = 0;

  for (let r = ROWS - 1; r >= 0; r--) {
    const isRowFull = board[r].every(cell => cell !== null);
    if (isRowFull) {
      board.splice(r, 1);
      board.unshift(new Array(COLS).fill(null));
      clearedCount++;
      r++; // 행이 내려왔으므로 현재 인덱스 다시 검사
    }
  }

  if (clearedCount > 0) {
    const points = [0, 100, 300, 500, 800];
    score += points[clearedCount] * level;
    linesCleared += clearedCount;
    level = Math.floor(linesCleared / 10) + 1;
    dropInterval = Math.max(100, 1000 - (level - 1) * 100);
    handleHighScore();
  }
}

// ============================================================
//  TODO 7: draw() + Phase 3 고스트 블록 구현 포함
// ============================================================
function getGhostY() {
  let ghostY = currentPiece.y;
  while (!isCollision({ ...currentPiece, y: ghostY + 1 }, 0, 0)) {
    ghostY++;
  }
  return ghostY;
}

function draw() {
  // ① 배경 지우기
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 격자 선 (옅게)
  ctx.strokeStyle = '#1e293b';
  ctx.lineWidth = 0.5;
  for (let c = 0; c < COLS; c++) {
    ctx.beginPath();
    ctx.moveTo(c * BLOCK_SIZE, 0);
    ctx.lineTo(c * BLOCK_SIZE, canvas.height);
    ctx.stroke();
  }
  for (let r = 0; r < ROWS; r++) {
    ctx.beginPath();
    ctx.moveTo(0, r * BLOCK_SIZE);
    ctx.lineTo(canvas.width, r * BLOCK_SIZE);
    ctx.stroke();
  }

  // ② board 고정 블록 그리기
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (board[r][c] !== null) {
        drawBlock(c, r, board[r][c]);
      }
    }
  }

  if (currentPiece) {
    // Phase 3: 고스트 블록 그리기 (반투명 격자 외곽선 스타일)
    const ghostY = getGhostY();
    ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
    ctx.strokeStyle = currentPiece.color;
    ctx.lineWidth = 1;
    for (let r = 0; r < currentPiece.shape.length; r++) {
      for (let c = 0; c < currentPiece.shape[r].length; c++) {
        if (currentPiece.shape[r][c] === 1) {
          const gx = currentPiece.x + c;
          const gy = ghostY + r;
          ctx.fillRect(gx * BLOCK_SIZE, gy * BLOCK_SIZE, BLOCK_SIZE - 1, BLOCK_SIZE - 1);
          ctx.strokeRect(gx * BLOCK_SIZE, gy * BLOCK_SIZE, BLOCK_SIZE - 1, BLOCK_SIZE - 1);
        }
      }
    }

    // ③ currentPiece 그리기
    for (let r = 0; r < currentPiece.shape.length; r++) {
      for (let c = 0; c < currentPiece.shape[r].length; c++) {
        if (currentPiece.shape[r][c] === 1) {
          drawBlock(currentPiece.x + c, currentPiece.y + r, currentPiece.color);
        }
      }
    }
  }
}

// ============================================================
//  TODO 8: 키보드 입력 처리 + Phase 3 하드 드롭 & 홀드 기능 포함
// ============================================================
document.addEventListener('keydown', (e) => {
  if (gameOver || !currentPiece) return;

  switch (e.key) {
    case 'ArrowLeft':
      if (!isCollision(currentPiece, -1, 0)) {
        currentPiece.x -= 1;
      }
      break;

    case 'ArrowRight':
      if (!isCollision(currentPiece, 1, 0)) {
        currentPiece.x += 1;
      }
      break;

    case 'ArrowDown':
      if (!isCollision(currentPiece, 0, 1)) {
        currentPiece.y += 1;
        score += 1; // 소프트 드롭 시 보너스 점수 1점
        handleHighScore();
        updateUI();
      } else {
        handleLockAndNext();
      }
      break;

    case 'ArrowUp':
      const rotatedShape = rotate(currentPiece.shape);
      const originalShape = currentPiece.shape;
      currentPiece.shape = rotatedShape;
      
      // 벽면 회전 보정(간단한 보정 logic 처리)
      if (isCollision(currentPiece, 0, 0)) {
        if (!isCollision(currentPiece, -1, 0)) currentPiece.x -= 1;
        else if (!isCollision(currentPiece, 1, 0)) currentPiece.x += 1;
        else currentPiece.shape = originalShape; // 보정 불가능 시 회전 취소
      }
      break;

    case ' ': // Space 키: 하드 드롭 (Phase 3)
      e.preventDefault();
      let dropDistance = 0;
      while (!isCollision(currentPiece, 0, 1)) {
        currentPiece.y += 1;
        dropDistance++;
      }
      score += dropDistance * 2; // 하드 드롭 시 낙하 거리당 2점 보너스
      handleLockAndNext();
      break;

    case 'Shift': // Shift 키: 홀드 기능 (Phase 3)
      e.preventDefault();
      handleHold();
      break;
  }

  draw();
});

function handleLockAndNext() {
  placePiece();
  clearLines();
  createPiece();
  updateUI();
}

// Phase 3: 홀드 전환 로직
function handleHold() {
  if (!canHold) return;
  canHold = false;

  const currentType = currentPiece.type;

  if (holdPiece === null) {
    holdPiece = {
      type: currentType,
      shape: SHAPES[currentType],
      color: COLORS[currentType]
    };
    currentPiece = nextPiece;
    nextPiece = generateRandomPiece();
    drawPreview(nextCtx, nextPiece);
  } else {
    const tempPiece = holdPiece;
    holdPiece = {
      type: currentType,
      shape: SHAPES[currentType],
      color: COLORS[currentType]
    };
    currentPiece = {
      type: tempPiece.type,
      shape: tempPiece.shape,
      color: tempPiece.color,
      x: Math.floor((COLS - tempPiece.shape[0].length) / 2),
      y: 0
    };
  }
  drawPreview(holdCtx, holdPiece);
}

// Phase 3: 미리보기 및 홀드 블록 캔버스 렌더링 함수
function drawPreview(ctxObj, piece) {
  ctxObj.clearRect(0, 0, 90, 90);
  if (!piece) return;

  ctxObj.fillStyle = piece.color;
  const sRows = piece.shape.length;
  const sCols = piece.shape[0].length;
  const pBlockSize = 20;

  const offsetX = (90 - sCols * pBlockSize) / 2;
  const offsetY = (90 - sRows * pBlockSize) / 2;

  for (let r = 0; r < sRows; r++) {
    for (let c = 0; c < sCols; c++) {
      if (piece.shape[r][c] === 1) {
        ctxObj.fillRect(
          offsetX + c * pBlockSize,
          offsetY + r * pBlockSize,
          pBlockSize - 1,
          pBlockSize - 1
        );
      }
    }
  }
}

// Phase 3: 최고 점수 기록 저장 및 동기화
function handleHighScore() {
  if (score > highScore) {
    highScore = score;
    localStorage.setItem('tetris_high_score', highScore);
    document.getElementById('highScoreDisplay').textContent = highScore;
  }
}

// ============================================================
//  TODO 9: gameLoop(timestamp)
// ============================================================
function gameLoop(timestamp) {
  if (gameOver) return;

  if (!lastTime) lastTime = timestamp;
  const deltaTime = timestamp - lastTime;

  if (deltaTime > dropInterval) {
    if (!isCollision(currentPiece, 0, 1)) {
      currentPiece.y += 1;
    } else {
      handleLockAndNext();
    }
    lastTime = timestamp;
  }

  draw();
  requestAnimationFrame(gameLoop);
}

// ============================================================
//  ■ UI 업데이트 헬퍼
// ============================================================
function updateUI() {
  document.getElementById('scoreDisplay').textContent = score;
  document.getElementById('levelDisplay').textContent = level;
  document.getElementById('linesDisplay').textContent = linesCleared;
  document.getElementById('highScoreDisplay').textContent = highScore;
}

// ============================================================
//  ■ 게임 시작 / 재시작
// ============================================================
function startGame() {
  initBoard();
  score        = 0;
  level        = 1;
  linesCleared = 0;
  gameOver     = false;
  dropInterval = 1000;
  lastTime     = 0;

  nextPiece    = null;
  holdPiece    = null;
  canHold      = true;

  highScore = localStorage.getItem('tetris_high_score') || 0;

  holdCtx.clearRect(0, 0, 90, 90);
  nextCtx.clearRect(0, 0, 90, 90);

  createPiece();
  updateUI();

  document.getElementById('overlay').classList.remove('show');
  requestAnimationFrame(gameLoop);
}

document.getElementById('restartBtn').addEventListener('click', startGame);

function showGameOver() {
  document.getElementById('overlay').classList.add('show');
}

// 게임 기동
startGame();
</script>
</body>
</html>
